name: new_portfolio
description: "A new Flutter project."


publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.7


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Localization
  slang: ^4.19.2
  slang_flutter: ^4.19.0

  # State management
  flutter_bloc: ^9.1.1

  # Platform integrations
  url_launcher: ^6.3.3

  # Animations
  countup: ^0.1.4
  flutter_animate: ^4.5.2
  animated_text_kit: ^4.3.0

  # UI and layout
  marqueer: ^2.7.0
  mosaic_grid: ^0.1.3
  dotted_border: ^3.1.0
  font_awesome_flutter: ^11.0.0



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.10.4
  slang_build_runner: ^4.19.0


flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/Surrah/
    - assets/images/Stbtrfx/
    - assets/images/Al Reef/
    - assets/images/American Soft/
    - assets/images/Al Reef Dashboard/
    - assets/images/Twins/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk/static/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk/static/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/SpaceGrotesk/static/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk/static/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk/static/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter/static/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter/static/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter/static/Inter_18pt-SemiBold.ttf
          weight: 600
